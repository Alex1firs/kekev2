# dispatch.kekeride.ng — the Park Dispatch PWA
#
# Add this server block to /opt/kekev2/nginx.conf on the droplet (the file the
# nginx_gateway container mounts read-only). It is kept in the repository so the
# config that makes the subdomain work is reviewable and not only present on one
# machine's disk.
#
# ── Why a proxy and not a static root ───────────────────────────────────
# The app is served BY the backend at /dispatch, and it talks to /api/v1 and
# opens a Socket.IO connection. Serving the files from nginx while the API lives
# on another host would make every request cross-origin: CORS preflights on each
# call, a second origin in ALLOWED_ORIGINS, cookies and tokens split across two
# names, and a service worker whose scope does not cover the API it depends on.
#
# Proxying everything to the same backend keeps the whole app same-origin, which
# is what the service worker, the socket and the session all assume.
#
# ── Before this works ───────────────────────────────────────────────────
#   1. DNS: an A record for dispatch.kekeride.ng → the droplet's IPv4.
#   2. A certificate (see docs/launch_runbook.md §3d).
#   3. ALLOWED_ORIGINS must include https://dispatch.kekeride.ng.

server {
    listen 80;
    server_name dispatch.kekeride.ng;

    # Certbot's webroot challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dispatch.kekeride.ng;

    ssl_certificate     /etc/letsencrypt/live/dispatch.kekeride.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispatch.kekeride.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A park tablet on sponsored data. Compression is worth more here than
    # almost anywhere else in the estate.
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # The app itself. `/dispatch/` on the backend, `/` here — so the PWA's
    # scope, start_url and service-worker registration all sit at the root of
    # this hostname.
    location / {
        proxy_pass http://api_prod:4000/dispatch/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same origin as the app, which is the entire point of proxying rather
    # than serving statically.
    location /api/ {
        proxy_pass http://api_prod:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO. Without the Upgrade headers the client silently falls back to
    # long-polling: it still works, which is why this is easy to get wrong and
    # never notice, but it costs battery and data on a device that has little
    # of either.
    location /socket.io/ {
        proxy_pass http://api_prod:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough that an idle socket is not cut mid-shift.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Driver photos, shown on the assignment sheet.
    location /uploads/ {
        proxy_pass http://api_prod:4000/uploads/;
        proxy_set_header Host $host;
        expires 1h;
    }

    location /health {
        proxy_pass http://api_prod:4000/health;
        access_log off;
    }

    # The shell must be revalidated on every load so a deploy can land. The
    # service worker still serves it offline; that copy is versioned and
    # dropped on activate, so it cannot outlive a deploy the way an HTTP cache
    # entry can.
    location = /index.html {
        proxy_pass http://api_prod:4000/dispatch/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        proxy_pass http://api_prod:4000/dispatch/sw.js;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    client_max_body_size 2m;
}
