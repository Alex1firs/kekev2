# ─────────────────────────────────────────────────────────────────────────
#  MANAGED BY GIT — infra/nginx/nginx.conf
#
#  Do not edit /opt/kekev2/nginx.conf by hand. That path is a deployed
#  artifact; edits there are overwritten by the next deploy and are invisible
#  to everyone reading the repository.
#
#  Edit this file, commit, then run:  infra/nginx/deploy.sh
#  Compare without changing anything: infra/nginx/deploy.sh --check
#
#  Why the deploy copies rather than letting git place the file, and what every
#  production-specific setting here is for: infra/nginx/README.md
# ─────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Shared security settings
    auth_basic "Staging Area - Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name api.kekeride.ng staging.kekeride.ng admin.kekeride.ng;

        location /.well-known/acme-challenge/ {
            auth_basic off;
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Production API (HTTPS)
    server {
        listen 443 ssl;
        server_name api.kekeride.ng;
        auth_basic off;

        ssl_certificate /etc/letsencrypt/live/api.kekeride.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kekeride.ng/privkey.pem;

        location / {
            set $prod_app http://api_prod:4000;
            proxy_pass $prod_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /adminer {
            auth_basic "Restricted Access - Database Management";
            proxy_pass http://adminer:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Staging API (HTTPS)
    server {
        listen 443 ssl;
        server_name staging.kekeride.ng;

        ssl_certificate /etc/letsencrypt/live/api.kekeride.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kekeride.ng/privkey.pem;

        # Park Dispatch PWA and the API it talks to.
        #
        # Basic auth stays ON for staging generally — it keeps a pre-release box
        # off the open internet — but it is OFF for these four paths, because:
        #
        #   - a service worker's own fetches do not reliably carry basic-auth
        #     credentials, so push acknowledgement would fail;
        #   - the dispatcher app already authenticates every request with a
        #     StaffUser session and park-scoped permissions, which is a stronger
        #     control than a shared htpasswd line;
        #   - a browser credential prompt in front of an installed PWA is the
        #     kind of thing that makes a launch-morning test inconclusive.
        location /dispatch {
            auth_basic off;
            proxy_pass http://api_staging:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location /api/ {
            auth_basic off;
            proxy_pass http://api_staging:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # Without the Upgrade headers the client silently falls back to
        # long-polling: it still works, which is why this is easy to get wrong
        # and never notice, but it costs battery and data on a park tablet.
        location /socket.io/ {
            auth_basic off;
            proxy_pass http://api_staging:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Driver photos on the assignment sheet.
        location /uploads/ {
            auth_basic off;
            proxy_pass http://api_staging:3000;
            proxy_set_header Host $host;
        }

        location / {
            set $staging_app http://api_staging:3000;
            proxy_pass $staging_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Admin Dashboard (HTTPS)
    server {
        listen 443 ssl;
        server_name admin.kekeride.ng;
        
        ssl_certificate /etc/letsencrypt/live/api.kekeride.ng/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kekeride.ng/privkey.pem;

        # Disable Basic Auth here to allow the custom app-level login screen to handle security
        auth_basic off;

        root /usr/share/nginx/html/admin;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Images may be cached hard: they are replaced by adding a new file.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires max;
            log_not_found off;
        }

        # app.js, styles.css and index.html are edited in place under fixed
        # names, so caching them by name caches them forever. Revalidate; the
        # ETag makes the usual answer a 304.
        location ~* \.(js|css|html)$ {
            add_header Cache-Control "no-cache";
            log_not_found off;
        }
    }
}
